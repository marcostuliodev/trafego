<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 560" role="img" aria-label="Amostra página 1 — Luminosidade das orquídeas">
  <rect width="400" height="560" rx="12" fill="#fbfaf5"/>
  <rect x="12" y="12" width="376" height="536" rx="8" fill="none" stroke="#deebe3" stroke-width="1.2"/>
  <!-- Header -->
  <rect x="24" y="24" width="352" height="42" rx="8" fill="#10281a"/>
  <text x="30" y="42" font-family="Georgia, serif" font-size="10" letter-spacing="2" fill="#e6cfa4" font-weight="600">CAPÍTULO 2</text>
  <text x="30" y="54" font-family="Georgia, serif" font-size="11" fill="#fbfaf5" font-weight="600">LUMINOSIDADE DAS ORQUÍDEAS</text>
  <!-- Mock table -->
  <rect x="24" y="82" width="352" height="110" rx="8" fill="white" stroke="#deebe3" stroke-width="1"/>
  <text x="36" y="102" font-family="Inter, sans-serif" font-size="9" font-weight="700" fill="#163523">FAIXAS DE LUMINOSIDADE (exemplos do guia)</text>
  <line x1="36" y1="110" x2="364" y2="110" stroke="#deebe3" stroke-width="1"/>
  <text x="36" y="128" font-family="Inter, sans-serif" font-size="8.5" fill="#33403a">• Sombra — Phalaenopsis: 10.000–15.000 lux (50–70% sombreamento)</text>
  <text x="36" y="144" font-family="Inter, sans-serif" font-size="8.5" fill="#33403a">• Meia-sombra — Cattleya: 15.000–30.000 lux</text>
  <text x="36" y="160" font-family="Inter, sans-serif" font-size="8.5" fill="#33403a">• Luz filtrada — ajuste conforme espécie e estação</text>
  <rect x="36" y="168" width="108" height="14" rx="7" fill="#f0f6f1"/>
  <text x="42" y="178" font-family="Inter, sans-serif" font-size="7" fill="#57645d">* valores referenciais</text>
  <!-- Illustration placeholder -->
  <rect x="24" y="206" width="352" height="140" rx="8" fill="#f0f6f1" stroke="#deebe3" stroke-width="1"/>
  <g transform="translate(200 276)">
    <ellipse cx="0" cy="0" rx="52" ry="38" fill="white" stroke="#deebe3" stroke-width="1"/>
    <path d="M-22 -8 C-10 -22 10 -22 22 -8 C14 6 -14 6 -22 -8 Z" fill="#e6cfa4" stroke="#c39a4b" stroke-width="0.8"/>
    <circle cx="0" cy="-2" r="5" fill="#c39a4b"/>
    <path d="M-26 18 C-18 10 -10 8 0 10 C10 8 18 10 26 18" fill="none" stroke="#8cb79c" stroke-width="1.4" stroke-linecap="round"/>
  </g>
  <text x="200" y="332" text-anchor="middle" font-family="Inter, sans-serif" font-size="7.5" fill="#6f7b74">Ilustração: excesso vs. falta de luz — folhas</text>
  <!-- Text block -->
  <rect x="24" y="362" width="352" height="84" rx="8" fill="white" stroke="#deebe3" stroke-width="1"/>
  <text x="36" y="382" font-family="Inter, sans-serif" font-size="8.5" fill="#162019" font-weight="600">Como identificar na prática</text>
  <text x="36" y="398" font-family="Inter, sans-serif" font-size="8" fill="#57645d">Folhas amareladas + queimaduras = sol demais.</text>
  <text x="36" y="412" font-family="Inter, sans-serif" font-size="8" fill="#57645d">Folhas escuras + sem flores = luz de menos.</text>
  <text x="36" y="426" font-family="Inter, sans-serif" font-size="8" fill="#57645d">Use a mão como teste rápido de sombra.</text>
  <!-- Footer note -->
  <rect x="24" y="462" width="352" height="36" rx="8" fill="#10281a"/>
  <text x="200" y="476" text-anchor="middle" font-family="Inter, sans-serif" font-size="7.5" fill="#bcd6c6">PÁGINA AMOSTRA 1 — CAP. 2 • Estrutura pronta para foto real/PDF</text>
  <text x="200" y="488" text-anchor="middle" font-family="Inter, sans-serif" font-size="7" fill="#8cb79c">Troque este SVG por export real quando stakeholder enviar</text>
  <text x="200" y="532" text-anchor="middle" font-family="Georgia, serif" font-size="8" letter-spacing="1" fill="#c39a4b">ORQUÍDEAS — PRINCÍPIOS BÁSICOS PARA CULTIVAR</text>
</svg>
