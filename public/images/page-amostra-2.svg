<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 560" role="img" aria-label="Amostra página 2 — Rega das orquídeas">
  <rect width="400" height="560" rx="12" fill="#fbfaf5"/>
  <rect x="12" y="12" width="376" height="536" rx="8" fill="none" stroke="#deebe3" stroke-width="1.2"/>
  <rect x="24" y="24" width="352" height="42" rx="8" fill="#10281a"/>
  <text x="30" y="42" font-family="Georgia, serif" font-size="10" letter-spacing="2" fill="#e6cfa4" font-weight="600">CAPÍTULO 3</text>
  <text x="30" y="54" font-family="Georgia, serif" font-size="11" fill="#fbfaf5" font-weight="600">REGA DAS ORQUÍDEAS — PASSO A PASSO</text>
  <!-- Steps -->
  <rect x="24" y="82" width="352" height="170" rx="8" fill="white" stroke="#deebe3" stroke-width="1"/>
  <text x="36" y="102" font-family="Inter, sans-serif" font-size="9" font-weight="700" fill="#163523">Quando regar? Olhe antes de molhar</text>
  <g font-family="Inter, sans-serif" font-size="8" fill="#33403a">
    <text x="36" y="122">1 — Toque o substrato: seco 2 cm abaixo? Hora de regar.</text>
    <text x="36" y="138">2 — Raízes prateadas = sede. Verdes = ainda úmido.</text>
    <text x="36" y="154">3 — Levante o vaso: leve = falta água; pesado = espere.</text>
    <text x="36" y="170">4 — Regue até escorrer, nunca deixe encharcado.</text>
    <text x="36" y="186">5 — Manhã é melhor — evita fungos à noite.</text>
  </g>
  <rect x="36" y="196" width="160" height="18" rx="9" fill="#fff4e0" stroke="#e6cfa4" stroke-width="0.8"/>
  <text x="44" y="208" font-family="Inter, sans-serif" font-size="7" font-weight="600" fill="#8a6423">Dica: substrato leve = drenagem rápida</text>
  <!-- Substratos -->
  <rect x="24" y="266" width="352" height="110" rx="8" fill="#f0f6f1" stroke="#deebe3" stroke-width="1"/>
  <text x="36" y="286" font-family="Inter, sans-serif" font-size="9" font-weight="700" fill="#163523">Substratos — escolha certa</text>
  <g font-family="Inter, sans-serif" font-size="7.5" fill="#57645d">
    <rect x="36" y="294" width="102" height="64" rx="6" fill="white" stroke="#deebe3" stroke-width="1"/>
    <text x="42" y="312" font-weight="600" fill="#163523">Casca de pinus</text>
    <text x="42" y="324">arejado • dura</text>
    <text x="42" y="336">mais 6–12 meses</text>
    <rect x="149" y="294" width="102" height="64" rx="6" fill="white" stroke="#deebe3" stroke-width="1"/>
    <text x="155" y="312" font-weight="600" fill="#163523">Esfagno</text>
    <text x="155" y="324">retém umidade</text>
    <text x="155" y="336">troca frequente</text>
    <rect x="262" y="294" width="102" height="64" rx="6" fill="white" stroke="#deebe3" stroke-width="1"/>
    <text x="268" y="312" font-weight="600" fill="#163523">Fibra de coco</text>
    <text x="268" y="324">equilíbrio</text>
    <text x="268" y="336">leve e solta</text>
  </g>
  <!-- Footer -->
  <rect x="24" y="392" width="352" height="56" rx="8" fill="white" stroke="#deebe3" stroke-width="1"/>
  <text x="36" y="412" font-family="Inter, sans-serif" font-size="8" fill="#57645d">Erro comum: regar todo dia sem olhar o substrato.</text>
  <text x="36" y="426" font-family="Inter, sans-serif" font-size="8" fill="#57645d">Resultado: raízes podres, folhas murchas, mau cheiro.</text>
  <text x="36" y="440" font-family="Inter, sans-serif" font-size="7.5" fill="#8cb79c" font-style="italic">Correção no guia: como ajustar por clima e vaso.</text>
  <rect x="24" y="462" width="352" height="36" rx="8" fill="#10281a"/>
  <text x="200" y="476" text-anchor="middle" font-family="Inter, sans-serif" font-size="7.5" fill="#bcd6c6">PÁGINA AMOSTRA 2 — CAP. 3 • Estrutura pronta para foto real/PDF</text>
  <text x="200" y="488" text-anchor="middle" font-family="Inter, sans-serif" font-size="7" fill="#8cb79c">Troque este SVG por export real quando stakeholder enviar</text>
  <text x="200" y="532" text-anchor="middle" font-family="Georgia, serif" font-size="8" letter-spacing="1" fill="#c39a4b">ORQUÍDEAS — PRINCÍPIOS BÁSICOS PARA CULTIVAR</text>
</svg>
